name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The Postgres-backed tests are skipped unless TEST_DATABASE_URL is set. They are the
    # only tests that exercise real transactions, locks and unique constraints — the
    # in-memory store serializes requests and cannot show a concurrency bug — so CI
    # always runs them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vantage
          POSTGRES_PASSWORD: vantage
          POSTGRES_DB: vantage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vantage:vantage@localhost:5432/vantage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @affiliate/web
